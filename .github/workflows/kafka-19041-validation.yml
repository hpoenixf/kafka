name: KAFKA-19041 fork synthetic validation

on:
  push:
    branches: [test/kafka-19041-readonly-20261111]
    paths: [.github/workflows/kafka-19041-validation.yml]

permissions:
  contents: read

concurrency:
  group: refresh-collaborators
  cancel-in-progress: false

jobs:
  generate-patch:
    if: github.repository == 'hpoenixf/kafka'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r committer-tools/requirements.txt
      - name: Synthetic collaborator fixture (not a real recommendation)
        run: |
          python - <<'PYTHON'
          import runpy
          module = runpy.run_path("committer-tools/refresh_collaborators.py")
          module["update_local_yaml_content"](".asf.yaml", ["fixture-z", "Fixture-a", "fixture-m"])
          PYTHON
      - name: Prepare patch
        id: patch
        run: |
          python - <<'PYTHON'
          import subprocess
          from pathlib import Path
          from ruamel.yaml import YAML

          yaml = YAML(typ="safe")
          before = yaml.load(subprocess.check_output(["git", "show", "HEAD:.asf.yaml"], text=True))
          after = yaml.load(Path(".asf.yaml").read_text())
          collaborators = after["github"].pop("collaborators")
          before["github"].pop("collaborators")
          if not isinstance(collaborators, list) or not collaborators or not all(
              isinstance(login, str) and login and login.isascii()
              and not any(char.isspace() for char in login) for login in collaborators
          ):
              raise ValueError("Refusing an empty or invalid collaborator list")
          if len({login.casefold() for login in collaborators}) != len(collaborators):
              raise ValueError("Refusing duplicate collaborators")
          if before != after:
              raise ValueError("Unexpected configuration changes outside collaborators")
          PYTHON
          git diff --check
          if git diff --quiet -- .asf.yaml; then
            echo 'No collaborator changes.' >> "$GITHUB_STEP_SUMMARY"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git diff -- .asf.yaml > collaborators.patch
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'SYNTHETIC TEST DATA ONLY. Do not apply this fixture as a real collaborator recommendation.' >> "$GITHUB_STEP_SUMMARY"
            git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.patch.outputs.changed == 'true'
        with:
          name: fixture-collaborators-patch
          path: collaborators.patch
          if-no-files-found: error
          retention-days: 30
