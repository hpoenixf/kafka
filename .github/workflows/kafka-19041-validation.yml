name: KAFKA-19041 artifact fixture validation

on:
  push:
    branches: [test/kafka-19041-readonly-20261111]
    paths: [.github/workflows/kafka-19041-validation.yml]

permissions:
  contents: read

concurrency:
  group: kafka-19041-fork-validation
  cancel-in-progress: false

jobs:
  generate-patch:
    if: github.repository == 'hpoenixf/kafka'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r committer-tools/requirements.txt
      - name: Generate synthetic fixture (not live contributor results)
        run: |
          python -c 'import runpy; m = runpy.run_path("committer-tools/refresh_collaborators.py"); m["update_local_yaml_content"](".asf.yaml", ["fixture-only-not-a-real-recommendation"])'
          echo 'SYNTHETIC FIXTURE ONLY. Do not apply to a real repository.' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare patch
        id: patch
        run: |
          git diff --check
          if git diff --quiet -- .asf.yaml; then
            echo 'No collaborator changes.' >> "$GITHUB_STEP_SUMMARY"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git diff -- .asf.yaml > collaborators.patch
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'A collaborator update patch is available as an artifact. A committer must review and apply it, then open a normal PR. No branch or repository settings were changed.' >> "$GITHUB_STEP_SUMMARY"
            git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.patch.outputs.changed == 'true'
        with:
          name: fixture-collaborators-patch
          path: collaborators.patch
          if-no-files-found: error
          retention-days: 30
